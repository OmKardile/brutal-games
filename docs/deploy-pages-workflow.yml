# Deploys the public arcade (landing + both games) to GitHub Pages as a static
# site. The server-side pieces (leaderboard API, auth, rewards program) are
# excluded from this build; the games then fall back to a per-browser local
# leaderboard automatically.
#
# The full dynamic app (with the shared SQLite leaderboard and the rewards
# program) runs from the same codebase on any Node/Bun host — see README.md.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Strip server-only routes for the static build
        run: |
          rm -rf src/app/api \
                 src/app/admin \
                 src/app/login \
                 src/app/signup \
                 src/app/forgot-password \
                 src/app/reset-password \
                 src/app/verify-email \
                 src/app/rewards

      - name: Build static site
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: bunx next build

      - name: Disable Jekyll processing (_next assets)
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
